name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux HID dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Real Herdr 0.9.1 API integration
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --retry 2 \
            https://github.com/herdrdev/herdr/releases/download/v0.9.1/herdr-linux-x86_64 \
            --output "$RUNNER_TEMP/herdr"
          printf '%s  %s\n' 2a02fed16beb651ef006e1d43f048f652ca4dc58ad053cd2d44450563d5c54b7 "$RUNNER_TEMP/herdr" | sha256sum --check
          chmod +x "$RUNNER_TEMP/herdr"
          cargo build --release --workspace --locked
          python3 scripts/validate-herdr.py --herdr "$RUNNER_TEMP/herdr" --artifacts "$RUNNER_TEMP/herdr-proof"

      - name: Save Herdr integration evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: herdr-integration
          path: ${{ runner.temp }}/herdr-proof
